<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcos Álvarez · Full-Stack & AI Agent Developer</title>
    <!--app-head-->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0B0F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Antes del primer pintado: aplica el tema guardado y decide el idioma (elección guardada →
      // idioma del navegador → español). src/i18n lo lee de <html lang>. El HTML prerenderizado
      // está en español; si el idioma es otro, se oculta hasta que React lo pinte (lang-pending).
      (function () {
        var root = document.documentElement;
        var theme, lang;
        try {
          theme = localStorage.getItem('theme');
          lang = localStorage.getItem('lang');
        } catch (e) {}
        if (theme === 'light' || theme === 'dark') {
          root.dataset.theme = theme;
          if (theme === 'light') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F4F2ED');
          }
        }
        if (lang !== 'es' && lang !== 'en') {
          var langs = navigator.languages || [navigator.language];
          lang = 'es';
          for (var i = 0; i < langs.length; i++) {
            var code = String(langs[i] || '')
              .slice(0, 2)
              .toLowerCase();
            if (code === 'es' || code === 'en') {
              lang = code;
              break;
            }
          }
        }
        root.lang = lang;
        if (lang !== 'es') {
          root.classList.add('lang-pending');
          // Si el JS no llega a pintar el otro idioma (error, bloqueo…), se muestra el español.
          setTimeout(function () {
            root.classList.remove('lang-pending');
          }, 4000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
